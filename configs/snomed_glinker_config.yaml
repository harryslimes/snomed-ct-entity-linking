pipeline:
  name: "snomed_super_dict_v1"

  data:
    allowed_concepts: "data/interim/glinker/allowed_concepts.parquet"
    super_dictionary_jsonl: "data/interim/glinker/super_dictionary_scoped.jsonl"
    folds_dir: "data/interim/glinker/folds"

  l1:
    model_path: "models/gliner_finetuned_l1"
    threshold: 0.4
    device: "cuda"
    entity_types: ["finding", "procedure", "body_structure"]
    max_len: 4096

  l2:
    exact_dictionary: true
    exact_dictionary_path: "data/interim/glinker/l2_exact_dictionary.tsv"
    gating:
      exact_short_circuit_unique: true
      exact_ambiguity_max_candidates: 1
      exact_decisive_min_score: 0.0
      exact_decisive_min_margin: 0.0
      fallback_on_no_exact: true
      fallback_on_ambiguous_exact: true
      top_k_exact: 50
      top_k_fuzzy: 50
      top_k_final: 50
      fuzziness: "AUTO"
    elasticsearch:
      enabled: true
      base_url: "http://127.0.0.1:9200"
      index_name: "snomed_super_dict_v1"
      index_body_path: "configs/es_index.json"
      top_k: 50

  l3:
    enabled: false
    type: "bi_encoder_retrieval"
    model: "knowledgator/gliner-linker-large-v1.0"
    index_path: "data/interim/glinker/l3_biencoder_index.npz"
    backend: "auto"
    search_backend: "auto"  # auto -> faiss_hnsw if faiss is installed, else bruteforce
    ann_index_dir: "data/interim/glinker/l3_ann_faiss"
    ann_candidate_pool: 256
    ann_ivf_nlist: 4096
    ann_ivf_nprobe: 16
    ann_hnsw_m: 32
    ann_hnsw_ef_search: 64
    trigger: "no_exact"
    top_k: 50
    max_merge_k: 50

  l4:
    enabled: false
    type: "cross_encoder_rerank"
    model: "knowledgator/gliner-linker-rerank-v1.0"
    backend: "auto"
    trigger: "ambiguous"
    min_candidates: 2
    max_pool_k: 50
    top_n: 1

postprocess:
  trim_punctuation: true
  trim_history_of_prefix: true
  enforce_allowed_concepts: true

resolver:
  min_top1_score_exact: 0.0
  min_top1_score_fuzzy: 0.0
  min_top1_score_l3: 0.0
  min_top1_score_l4: 0.0
  min_score_margin: 0.0
  max_second_to_first_ratio: 1.0
  route_min_top1_score:
    none+l3+l4: 0.6
